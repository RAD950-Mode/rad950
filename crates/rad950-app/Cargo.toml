[package]
name = "rad950-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform RAD950 desktop transceiver app (GUI default, --text TUI)"

[[bin]]
name = "rad950"
path = "src/main.rs"

[dependencies]
urad950.workspace = true
rad950-node.workspace = true
clap.workspace = true
egui.workspace = true
ratatui.workspace = true
crossterm.workspace = true

[target.'cfg(not(windows))'.dependencies]
eframe.workspace = true

# On Windows, use wgpu (DirectX 12 + automatic Microsoft WARP software fallback)
# instead of glow/OpenGL 2.0+, so rad950 runs on VMs, RDP sessions, and PCs
# without an OpenGL 2.0+ ICD driver.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
wgpu = { version = "24", default-features = false, features = ["dx12"] }
