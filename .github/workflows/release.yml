name: Release RAD-950 Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.1.5)"
        required: true
        default: "v0.1.5"
      skip_publish:
        description: "Build artifacts only without creating a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rad950-macos-arm64
            ext: tar.gz
            bin: rad950
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rad950-macos-x64
            ext: tar.gz
            bin: rad950
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: rad950-linux-x64
            ext: tar.gz
            bin: rad950
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rad950-windows-x64
            ext: zip
            bin: rad950.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio & GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Run workspace unit tests (native targets)
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p rad950-app --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          cp README.md dist/ 2>/dev/null || true
          tar -C dist -czf "${{ matrix.artifact }}.${{ matrix.ext }}" .

      - name: Sign Windows binary (if PFX secret configured)
        if: runner.os == 'Windows' && env.WIN_CERT_PFX_BASE64 != ''
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "target\${{ matrix.target }}\release\${{ matrix.bin }}"
          Remove-Item cert.pfx -Force

      - name: Package archive & installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.bin }}" "dist\${{ matrix.bin }}"
          if (Test-Path README.md) { Copy-Item README.md dist\ }
          # Bundle Hamlib rigctld.exe + runtime DLLs so Windows hams need zero separate Hamlib install
          Invoke-WebRequest -Uri "https://github.com/Hamlib/Hamlib/releases/download/4.5.5/hamlib-w64-4.5.5.zip" -OutFile "hamlib.zip"
          Expand-Archive -Path "hamlib.zip" -DestinationPath "hamlib-tmp" -Force
          $hlBin = (Get-ChildItem -Path "hamlib-tmp" -Recurse -Filter "rigctld.exe" | Select-Object -First 1).DirectoryName
          Copy-Item "$hlBin\rigctld.exe" "dist\"
          Copy-Item "$hlBin\*.dll" "dist\"
          Remove-Item -Recurse -Force hamlib.zip, hamlib-tmp
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.artifact }}.${{ matrix.ext }}"
          if (Test-Path installer\rad950.iss) {
            iscc /DAppVersion="${{ inputs.tag || github.ref_name }}" installer\rad950.iss
            Copy-Item "dist-installer\rad950-windows-x64-setup.exe" "rad950-windows-x64-setup.exe"
          }

      - name: Sign Windows installer (if PFX secret configured)
        if: runner.os == 'Windows' && env.WIN_CERT_PFX_BASE64 != ''
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "rad950-windows-x64-setup.exe"
          Remove-Item cert.pfx -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.${{ matrix.ext }}
            rad950-windows-x64-setup.exe

  package-macos-dmg:
    name: Package macOS Universal DMG
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rad950-macos-arm64
          path: arm64

      - uses: actions/download-artifact@v4
        with:
          name: rad950-macos-x64
          path: x64

      - name: Build, Sign & Notarize Universal RAD-950.app & DMG
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          mkdir -p arm64-bin x64-bin
          tar -xzf arm64/rad950-macos-arm64.tar.gz -C arm64-bin
          tar -xzf x64/rad950-macos-x64.tar.gz -C x64-bin
          TAG="${{ inputs.tag || github.ref_name }}"
          chmod +x installer/macos/make_dmg.sh

          SIGN_IDENTITY=""
          if [ -n "$MACOS_CERT_P12_BASE64" ]; then
            KC_PATH="$RUNNER_TEMP/rad950-build.keychain-db"
            KC_PASS="$(openssl rand -hex 16)"
            P12_PATH="$RUNNER_TEMP/devid.p12"
            echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$P12_PATH"
            security create-keychain -p "$KC_PASS" "$KC_PATH"
            security set-keychain-settings -lut 21600 "$KC_PATH"
            security unlock-keychain -p "$KC_PASS" "$KC_PATH"
            security import "$P12_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KC_PASS" "$KC_PATH"
            security list-keychain -d user -s "$KC_PATH" $(security list-keychain -d user | tr -d '"')
            SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KC_PATH" | grep "Developer ID Application" | head -n 1 | sed -n 's/.*"\(.*\)".*/\1/p')"
            echo "Signing with: $SIGN_IDENTITY"
            rm -f "$P12_PATH"
          fi

          SIGN_IDENTITY="$SIGN_IDENTITY" ./installer/macos/make_dmg.sh arm64-bin/rad950 x64-bin/rad950 "$TAG" rad950-macos-universal.dmg

          if [ -n "$SIGN_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool submit rad950-macos-universal.dmg \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple rad950-macos-universal.dmg
            xcrun stapler validate rad950-macos-universal.dmg
          fi

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: rad950-macos-universal-dmg
          path: rad950-macos-universal.dmg

  publish:
    name: Publish GitHub Release
    needs: [build, package-macos-dmg]
    if: ${{ !inputs.skip_publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum rad950-* > SHA256SUMS.txt

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" artifacts/* \
              --repo "${{ github.repository }}" \
              --title "RAD-950 $TAG" \
              --generate-notes
          fi
