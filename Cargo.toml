[workspace]
resolver = "2"
members = [
    "crates/urad950",
    "crates/rad950-node",
    "crates/rad950-app",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/RAD950-Mode/rad950"

[workspace.dependencies]
urad950 = { path = "crates/urad950" }
rad950-node = { path = "crates/rad950-node" }
cpal = "0.15"
eframe = "0.31"
egui = "0.31"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
serialport = { version = "4", default-features = false }
